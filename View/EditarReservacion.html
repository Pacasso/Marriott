<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Reservación - Marriott</title>
    
    <!-- Guardián de seguridad -->
    <script src="js/auth.js"></script>
    
    <link rel="stylesheet" href="css/EditarReservacion.css">
</head>
<body>

    <button class="menu-btn" id="btn_menu">☰</button>

    <div class="sidebar" id="sidebar">
        <div class="logo">Marriott</div> 
        <ul>
            <li><a href="Panel.html">🏠 Inicio</a></li>
            <li><a href="PanelUsuarios.html">👥 Usuarios</a></li>
            <li><a href="Destinos.html">🌎 Destinos</a></li>
            <li><a href="PanelHoteles.html">🏨 Hoteles</a></li>
            <li><a href="PanelHabitaciones.html">🛏 Habitaciones</a></li>
            <li><a href="PanelReservaciones.html" class="activo">📅 Reservaciones</a></li>
            <li><a href="PanelServicios.html">⭐ Servicios</a></li>
            <li><a href="#" onclick="cerrarSesion(event)">🚪 Cerrar Sesión</a></li>
        </ul>
    </div>

    <div class="main" id="main">
        
        <div class="header">
            <h1>Editar Reservación</h1>
            <p>Modifique los datos de la estadía o actualice el estado de la reserva actual.</p>
        </div>

        <div class="formulario-container">
            <h2>Datos de la Reserva #RES-001</h2>
            
            <form id="form_editar_reservacion">
                <!-- ID Oculto para uso futuro en el backend -->
                <input type="hidden" id="id_reservacion" value="1">

                <!-- Fila 1: Huésped (Precargado con datos del Proyecto) -->
                <div class="grupo-form">
                    <label for="id_huesped">Huésped (Cliente)</label>
                    <select id="id_huesped" required>
                        <option value="1" selected>Juan Francisco Meneses Blé</option>
                        <option value="2">Jennyfer Denis Campos Islas</option>
                        <option value="3">Melissa Sotelo Flores</option>
                        <option value="4">Melanie Teresa Hernández Medrano</option>
                        <option value="5">Carlos Alberto Solana Hernández</option>
                        <option value="6">Adrián Salvador Campos Higuera</option>
                    </select>
                </div>

                <!-- Fila 2: Hotel y Habitación -->
                <div class="form-fila">
                    <div class="grupo-form">
                        <label for="id_hotel">Hotel</label>
                        <select id="id_hotel" required>
                            <option value="1" selected>Marriott Cancún Resort</option>
                            <option value="2">Marriott Los Cabos</option>
                        </select>
                    </div>
                    
                    <div class="grupo-form">
                        <label for="id_habitacion">Habitación</label>
                        <select id="id_habitacion" required>
                            <option value="101" selected>Suite Presidencial (101) - $5,000/noche</option>
                            <option value="205">Habitación Doble (205) - $2,500/noche</option>
                        </select>
                    </div>
                </div>

                <!-- Fila 3: Fechas -->
                <div class="form-fila">
                    <div class="grupo-form">
                        <label for="fecha_entrada">Fecha de Entrada (Check-in)</label>
                        <input type="date" id="fecha_entrada" value="2026-07-25" required>
                    </div>
                    
                    <div class="grupo-form">
                        <label for="fecha_salida">Fecha de Salida (Check-out)</label>
                        <input type="date" id="fecha_salida" value="2026-07-30" required>
                    </div>
                </div>

                <!-- Fila 4: Costo y Estado -->
                <div class="form-fila">
                    <div class="grupo-form">
                        <label for="costo_total">Costo Total Estimado (MXN)</label>
                        <input type="text" id="costo_total" value="$25,000.00" readonly class="input-readonly">
                    </div>

                    <div class="grupo-form">
                        <label for="estado_reserva">Estado de la Reserva</label>
                        <select id="estado_reserva" required>
                            <option value="Pendiente">Pendiente</option>
                            <option value="Confirmada" selected>Confirmada</option>
                            <option value="Cancelada">Cancelada</option>
                        </select>
                    </div>
                </div>

                <div class="acciones-form">
                    <a href="PanelReservaciones.html" class="btn-cancelar">Cancelar</a>
                    <button type="submit" class="btn-actualizar" id="btn_actualizar">Actualizar Reservación</button>
                </div>
            </form>
        </div>

    </div>

    <script>
        document.getElementById("btn_menu").addEventListener("click", function() {
            document.getElementById("sidebar").classList.toggle("ocultar");
            document.getElementById("main").classList.toggle("expandir");
        });
    </script>
    <script src="js/editarReservacion.js"></script>
</body>
</html>
