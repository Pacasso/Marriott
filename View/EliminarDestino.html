<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Destino</title>
    <script src="js/auth.js"></script>
    <link rel="stylesheet" href="css/EliminarDestino.css">
</head>

<body>

    <div class="contenedor">

        <div class="icono">
            ⚠️
        </div>

        <h1>Eliminar Destino</h1>

        <p>
            ¿Estás seguro de que deseas eliminar este destino?
        </p>

        <p class="detalle">
            Esta acción no se puede deshacer.
        </p>

        <div class="botones">

            <button class="btn-eliminar"
                    onclick="eliminarDestino()">
                Sí, Eliminar
            </button>

            <a href="Destinos.html"
               class="btn-cancelar">
                Cancelar
            </a>

        </div>

    </div>

    <script src="js/eliminarDestino.js"></script>

</body>

</html>
