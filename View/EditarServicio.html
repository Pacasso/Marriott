<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Servicio - Marriott</title>
    <link rel="stylesheet" href="css/nuevoDestino.css"> 
    <script src="js/auth.js"></script>
</head>
<body>

<div class="contenedor">

    <h1>Editar Servicio</h1>

    <form>

        <label>ID del Servicio</label>
        <input type="text" id="id_servicio" value="1" disabled style="background-color: #e9ecef; color: #6c757d; cursor: not-allowed;">

        <label>Nombre del Servicio</label>
        <input type="text" id="nombre_servicio" value="Spa Premium" placeholder="Ej. Spa Premium">

        <label>Descripción</label>
        <input type="text" id="descripcion_servicio" value="Masajes relajantes, jacuzzi y tratamientos corporales." placeholder="Descripción detallada del servicio">

        <label>Costo (MXN)</label>
        <input type="number" id="costo_servicio" value="850.00" placeholder="Ej. 850" min="0" step="0.01">

        <label>Ícono Representativo</label>
        <select id="icono_servicio">
            <option value="🧖" selected>🧖 Spa / Relajación</option>
            <option value="🍽">🍽 Restaurante / Alimentos</option>
            <option value="📶">📶 Internet / Tecnología</option>
            <option value="🚗">🚗 Estacionamiento / Transporte</option>
            <option value="💪">💪 Gimnasio / Deportes</option>
            <option value="🧹">🧹 Limpieza / Mantenimiento</option>
        </select>

        <label>Estado</label>
        <select id="estatus_servicio">
            <option value="1" selected>Disponible</option>
            <option value="0">No Disponible</option>
        </select>

        <div class="botones">
            <button type="button" id="btn_actualizar">Actualizar</button>

            <a href="PanelServicios.html" class="btn-cancelar">
                Cancelar
            </a>
        </div>

    </form>

</div>

<script src="js/editarServicio.js"></script>
</body>
</html>
